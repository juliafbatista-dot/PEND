<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Pratica - Drag and Drop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🛒 Carrinho de Compras</h1>
    <h3>Escolha quais peças você deseja adicionar ao carrinho:</h3>

    <h4>Produtos</h4>

    <div id="produto" class="produto" draggable="true">
        👖 Calça
    </div>

    <div id="produto2" class="produto" draggable="true">
        👕 Camiseta
    </div>

    <div id="produto3" class="produto" draggable="true">
        👟 Tênis
    </div>

    <div id="produto4" class="produto" draggable="true">
        🧢 Boné
    </div>

    <div id="carrinho">
        <h4>🛒 Carrinho (Arraste o produto ate aqui...)</h4>
    </div>

    <p id="mensagem"></p>

    <script src="script.js"></script>

</body>
</html>
