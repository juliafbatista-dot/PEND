<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Entrega</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📦 Confirmação de Entrega Shopee</h1>
        <p>Permita o acesso à localização e à câmera para concluir a entrega.</p>

        <div id="sucesso">
            <p>✅ Localização obtida com sucesso!</p>
        </div>

        <div id="erro">
            <p>❌ Não foi possível obter a localização.</p>
        </div>

        <div class="camera-box">
            <video id="camera" autoplay playsinline></video>
            <button id="botao">Tirar foto</button>
            <canvas id="canvas"></canvas>
            <img id="foto" alt="Sua foto aparecerá aqui">
        </div>

        <div class="dados">
            <h3>Dados da Entrega</h3>
            <p><strong>Latitude:</strong> <span id="latitude">-</span></p>
            <p><strong>Longitude:</strong> <span id="longitude">-</span></p>
            <p><strong>Precisão:</strong> <span id="precisao">-</span> metros</p>
        </div>
    </div>

    <script src="atividade.js"></script>
</body>
</html>
